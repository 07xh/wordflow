plugins { id 'com.android.application' }

def wfSigningPropertiesPath = System.getenv('WF_SIGNING_PROPERTIES')
def wfSigningProperties = new Properties()
if (wfSigningPropertiesPath) {
    new File(wfSigningPropertiesPath).withInputStream { input ->
        wfSigningProperties.load(input)
    }
}

android {
    namespace 'dev.wordflow.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.wordflow.app'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.5.2'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        if (wfSigningPropertiesPath) {
            stable {
                def signingRoot = new File(wfSigningPropertiesPath).parentFile
                storeFile new File(signingRoot, wfSigningProperties.getProperty('storeFile'))
                storePassword wfSigningProperties.getProperty('storePassword')
                keyAlias wfSigningProperties.getProperty('keyAlias')
                keyPassword wfSigningProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (wfSigningPropertiesPath) signingConfig signingConfigs.stable
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
