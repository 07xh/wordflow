name: Normalize WordFlow source (one-time)

on:
  push:
    paths:
      - '.github/workflows/normalize-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == '07xh/wordflow'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract original verified Android project
        shell: bash
        run: |
          set -euo pipefail
          cat buildsrc/part0{1,2,3,4}.b64 | base64 --decode > /tmp/wordflow-source.tar.xz
          echo "c60b05e7cb96dcb48cdbcbf7f2faecc2222863f39899690c4cdd1619edd22c32  /tmp/wordflow-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/wordflow-source.tar.xz
          test -f app/src/main/java/dev/wordflow/app/WordService.java
          test -f scripts/verify_source.sh
          rm -rf buildsrc
          rm -f .github/workflows/android.yml
          cat > SOURCE_LAYOUT.md <<'EOF'
          # WordFlow Android source layout
          
          The original Base64 source archive has been replaced with normal files.
          
          - `app/src/main/java`: Android Java app
          - `app/src/test`: unit tests
          - `scripts`: offline tests and device smoke tests
          - `.github/workflows/build.yml`: CI Android APK build
          
          GitHub Actions runs Gradle against these checked-in sources.
          EOF
      - name: Commit ordinary source only (leave workflows unchanged)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md BUILD_APK.md CHANGELOG.md .gitignore app build.gradle gradle.properties scripts settings.gradle SOURCE_LAYOUT.md buildsrc
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Sources already present"
          else
            git commit -m "build: check in editable Android project sources"
            git push origin HEAD:main
          fi
