name: WordFlow Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Reconstruct WordFlow source
        shell: bash
        run: |
          set -euo pipefail
          cat buildsrc/part0{1,2,3,4}.b64 | base64 --decode > wordflow-source.tar.xz
          echo "c60b05e7cb96dcb48cdbcbf7f2faecc2222863f39899690c4cdd1619edd22c32  wordflow-source.tar.xz" | sha256sum -c -
          tar -xJf wordflow-source.tar.xz
          test -f app/build.gradle
          test -f scripts/verify_source.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 using GitHub hosted SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source
        run: bash scripts/verify_source.sh

      - name: Compile and test Android app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WordFlow-v0.3.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
