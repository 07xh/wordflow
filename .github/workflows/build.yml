name: WordFlow Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compatibility with legacy packed source (temporary)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/build.gradle ]; then
            cat buildsrc/part0{1,2,3,4}.b64 | base64 --decode > /tmp/wordflow-source.tar.xz
            echo "c60b05e7cb96dcb48cdbcbf7f2faecc2222863f39899690c4cdd1619edd22c32  /tmp/wordflow-source.tar.xz" | sha256sum -c -
            tar -xJf /tmp/wordflow-source.tar.xz
          fi
          test -f app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify source
        run: bash scripts/verify_source.sh
      - name: Compile and test Android app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: WordFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
